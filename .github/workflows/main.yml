name: Medical System CI/CD Pipeline

on:
  push:
    branches: [ "develop", "main", "master" ]
  pull_request:
    branches: [ "develop", "main", "master" ]

jobs:
  integration-tests:
    runs-on: ubuntu-latest

    steps:
    - name:  1. Клонирование исходного кода из репозитория
      uses: actions/checkout@v4

    - name:  2. Развертывание интерпретатора Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name:  3. Установка системных зависимостей бэкенда
      run: |
        sudo apt-get update && sudo apt-get install -y sqlite3
        pip install --upgrade pip
        pip install fastapi uvicorn pydantic pydantic-settings email-validator pytest httpx starlette

    - name:  4. Предварительное развертывание и сидирование тестовой СУБД SQLite
      run: |
        sqlite3 medical.db < schema.sql
        sqlite3 medical.db < seed.sql

    - name:  5. Автоматический прогон пакета 10 интеграционных тестов
      env:
        PYTHONUTF8: 1
        PYTHONPATH: .
      run: |
        python -m pytest testing/lab10/test_automation.py -v
