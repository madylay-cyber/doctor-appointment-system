version: '3.8'

services:
  # Название нашего сервиса медицинской системы
  web-api:
    # 1. Инструкция для автоматической сборки образа на основе локального Dockerfile
    build:
      context: .
      dockerfile: Dockerfile
    
    # 2. Имя собираемого контейнера в системе Docker
    container_name: medical_booking_api
    
    # 3. Автоматический перезапуск контейнера в случае непредвиденного сбоя внутри Python
    restart: always
    
    # 4. Проброс сетевых портов: связываем порт 8000 вашего компьютера с портом 8000 внутри контейнера
    ports:
      - "8000:8000"
    
    # 5. Автоматическое подключение нашего файла конфигураций и переменных окружения
    env_file:
      - .env.example
    
    # 6. МОНТИРОВАНИЕ ТОМОВ (Volumes): Критически важная настройка для сохранения данных.
    # Связывает локальную папку базы данных на вашем компьютере с базой внутри контейнера.
    # Благодаря этому, если контейнер будет остановлен или удален, все ваши 11 заявок, 
    # а также новые созданные через Swagger записи к врачам гарантированно сохранятся!
    volumes:
      - ./medical.db:/app/medical.db
    
    # 7. Задаем метаданные для удобной фильтрации логов в Docker Desktop
    labels:
      project: "medical-booking-system"
      tier: "backend"
