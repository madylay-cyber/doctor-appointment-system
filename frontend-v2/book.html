<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Запись на прием — МедРегистратура</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <header class="app-header">
        <div class="container header-inner">
            <a href="dashboard.html" class="logo">
                <div class="logo-icon">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"></polyline></svg>
                </div>
                <div class="logo-text">
                    <span class="logo-title">МедРегистратура</span>
                    <span class="logo-subtitle">МИС · Поликлиника № 4</span>
                </div>
            </a>
            <nav class="main-nav">
                <a href="dashboard.html" class="nav-link active">Приемы</a>
                <a href="#" class="nav-link">Расписание</a>
                <a href="#" class="nav-link">Пациенты</a>
                <a href="#" class="nav-link">Врачи</a>
                <a href="#" class="nav-link">Отчеты</a>
            </nav>
            <div class="user-menu">
                <button class="icon-btn" aria-label="Уведомления">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path><path d="M13.73 21a2 2 0 0 1-3.46 0"></path></svg>
                </button>
                <div class="user-profile">
                    <div class="avatar">АС</div>
                    <div class="user-info">
                        <span class="user-name">Смирнова А. В.</span>
                        <span class="user-role">Администратор</span>
                    </div>
                </div>
            </div>
        </div>
    </header>

    <main class="container page-content">
        <nav class="breadcrumbs">
            <a href="dashboard.html">Приемы</a> <span>/</span> Новая заявка
        </nav>
        <div class="page-header">
            <div>
                <h1 class="page-title">Запись на прием к врачу</h1>
                <p class="page-subtitle">Заявка SLT-1047 · черновик сохраняется автоматически</p>
            </div>
        </div>

        <div class="booking-layout">
            <section class="card">
                <div class="form-group">
                    <label>Пациент (ФИО / ОМС)</label>
                    <select class="select-control w-100" id="patientSelect">
                        <option value="6">Иванова Мария Сергеевна · 7824 9031 5567 0012</option>
                    </select>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>Категория услуг</label>
                        <select class="select-control w-100" id="categorySelect">
                            <option value="4">Кардиология · I10–I15</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Код МКБ-10</label>
                        <select class="select-control w-100">
                            <option>I10 — Гипертензия</option>
                        </select>
                    </div>
                </div>

                <div class="form-group">
                    <label>Выбор специалиста</label>
                    <div class="doctor-selector" id="doctorList" style="max-height: 400px; overflow-y: auto;">
                        <!-- Врачи будут добавлены скриптом ниже -->
                    </div>
                </div>

                <div class="form-group">
                    <label>Причина обращения</label>
                    <textarea class="input-control" rows="4" placeholder="Опишите жалобы пациента..."></textarea>
                </div>
            </section>

            <aside class="card">
                <div class="card-header">
                    <h2>Дата и время</h2>
                </div>
                
                <div class="date-tabs" id="dateTabs"></div>

                <p class="slot-date-label">Доступное время:</p>
                <div class="slot-legend">
                    <span class="legend-item"><span class="dot dot-primary"></span> Выбрано</span>
                    <span class="legend-item"><span class="dot dot-secondary"></span> Занято</span>
                </div>
                
                <div class="slots-grid">
                    <button class="slot" data-time="09:00">09:00</button>
                    <button class="slot disabled">09:30</button>
                    <button class="slot" data-time="10:00">10:00</button>
                    <button class="slot" data-time="10:30">10:30</button>
                    <button class="slot" data-time="11:00">11:00</button>
                    <button class="slot" data-time="11:30">11:30</button>
                    <button class="slot disabled">12:00</button>
                    <button class="slot" data-time="12:30">12:30</button>
                    <button class="slot disabled">13:00</button>
                    <button class="slot" data-time="14:00">14:00</button>
                    <button class="slot" data-time="14:30">14:30</button>
                    <button class="slot" data-time="15:00">15:00</button>
                </div>
                
                <div class="selected-slot-info" id="selectedSlotText">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg>
                    Выберите дату и время
                </div>
                
                <div class="form-actions">
                    <a href="dashboard.html" class="btn btn-outline">Отмена</a>
                    <button class="btn btn-primary btn-block" id="bookBtn">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg>
                        Забронировать слот
                    </button>
                </div>
            </aside>
        </div>
    </main>

    <script>
        console.log("Загружен финальный код без запросов к серверу!");

        const API_BASE_URL = 'https://doctor-appointment-system-90ta.onrender.com';

        // СПИСОК ВРАЧЕЙ, ЗАШИТЫЙ В КОД (НИКАКИХ ЗАПРОСОВ)
        const doctorsList = [
            { id: 4, fio: "Петрова Елена Андреевна" },
            { id: 5, fio: "Ким Алексей Борисович" },
            { id: 3, fio: "Васильев Игорь Олегович" },
            { id: 1, fio: "Смирнов Иван Петрович" },
            { id: 2, fio: "Иванова Анна Сергеевна" },
            { id: 6, fio: "Морозов Олег Дмитриевич" },
            { id: 7, fio: "Соколова Екатерина Игоревна" },
            { id: 8, fio: "Лебедев Дмитрий Николаевич" },
            { id: 9, fio: "Козлов Сергей Владимирович" },
            { id: 10, fio: "Новикова Ольга Александровна" }
        ];

        document.addEventListener('DOMContentLoaded', () => {
            const doctorListContainer = document.getElementById('doctorList');
            
            // Отрисовка врачей
            doctorListContainer.innerHTML = '';
            doctorsList.forEach((doc, index) => {
                const nameParts = doc.fio.split(' ');
                const initials = nameParts.length >= 2 ? nameParts[0][0] + nameParts[1][0] : 'ДР';
                const cabinetNumber = 200 + index + 1;

                const label = document.createElement('label');
                label.className = `doctor-option ${index === 0 ? 'selected' : ''}`;
                
                label.innerHTML = `
                    <div class="doctor-avatar">${initials}</div>
                    <div class="doctor-info">
                        <span class="doctor-name">${doc.fio}</span>
                        <span class="doctor-meta">Врач · каб. ${cabinetNumber}</span>
                    </div>
                    <input type="radio" name="doctor" value="${doc.id}" ${index === 0 ? 'checked' : ''}>
                `;

                // Клик для выделения
                label.addEventListener('click', function() {
                    document.querySelectorAll('.doctor-option').forEach(el => el.classList.remove('selected'));
                    this.classList.add('selected');
                });
                
                doctorListContainer.appendChild(label);
            });

            // ЛОГИКА ДАТ
            const dateTabsContainer = document.getElementById('dateTabs');
            const slots = document.querySelectorAll('.slots-grid .slot:not(.disabled)');
            const selectedSlotText = document.getElementById('selectedSlotText');
            let selectedTime = null; 
            let selectedDate = null; 

            if (dateTabsContainer) {
                const months = ['янв', 'фев', 'мар', 'апр', 'мая', 'июн', 'июл', 'авг', 'сен', 'окт', 'ноя', 'дек'];
                for (let i = 1; i <= 3; i++) {
                    let d = new Date();
                    d.setDate(d.getDate() + i); 
                    let dateStr = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`; 

                    let btn = document.createElement('button');
                    btn.type = 'button';
                    btn.className = 'date-tab';
                    btn.textContent = `${d.getDate()} ${months[d.getMonth()]}`;
                    btn.setAttribute('data-date', dateStr);

                    btn.addEventListener('click', function(e) {
                        e.preventDefault();
                        document.querySelectorAll('.date-tab').forEach(b => b.classList.remove('active'));
                        this.classList.add('active');
                        selectedDate = this.getAttribute('data-date');
                        updateInfoText();
                    });
                    dateTabsContainer.appendChild(btn);
                    if (i === 1) btn.click(); 
                }
            }

            // ЛОГИКА ВРЕМЕНИ
            if (slots.length > 0) {
                slots.forEach(slot => {
                    slot.addEventListener('click', function(e) {
                        e.preventDefault(); 
                        slots.forEach(s => s.classList.remove('active'));
                        this.classList.add('active');
                        selectedTime = this.getAttribute('data-time'); 
                        updateInfoText();
                    });
                });
            }

            function updateInfoText() {
                if (!selectedSlotText) return;
                if (selectedDate && selectedTime) {
                    selectedSlotText.innerHTML = `Выбрано: ${selectedDate}, ${selectedTime} · 30 мин`;
                } else if (selectedDate) {
                    selectedSlotText.innerHTML = `Выбрана дата: ${selectedDate}. Выберите время.`;
                }
                selectedSlotText.style.color = "var(--primary)";
            }

            // БРОНИРОВАНИЕ
            const bookButton = document.getElementById('bookBtn');
            if (bookButton) {
                bookButton.addEventListener('click', async function(event) {
                    event.preventDefault();

                    const patientId = document.getElementById('patientSelect')?.value;
                    const categoryId = document.getElementById('categorySelect')?.value;
                    const doctorRadio = document.querySelector('input[name="doctor"]:checked');

                    if (!selectedDate || !selectedTime || !doctorRadio) {
                        alert("Выберите дату, время и врача!");
                        return;
                    }

                    const appointmentData = {
                        patient_id: parseInt(patientId), 
                        doctor_id: parseInt(doctorRadio.value),
                        category_id: parseInt(categoryId),
                        datetime_slot: `${selectedDate} ${selectedTime}`
                    };

                    const originalText = bookButton.innerHTML;
                    bookButton.innerHTML = "Бронирование...";
                    bookButton.disabled = true;

                    try {
                        const response = await fetch(`${API_BASE_URL}/api/v1/appointments`, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify(appointmentData)
                        });

                        if (response.ok) {
                            window.location.href = 'dashboard.html';
                        } else {
                            const errorData = await response.json();
                            alert(`Ошибка сервера: ${errorData.detail || errorData.message || 'Не удалось создать'}`);
                            bookButton.innerHTML = originalText;
                            bookButton.disabled = false;
                        }
                    } catch (error) {
                        alert("Ошибка сети. Сервер не отвечает.");
                        bookButton.innerHTML = originalText;
                        bookButton.disabled = false;
                    }
                });
            }
        });
    </script>
</body>
</html>
