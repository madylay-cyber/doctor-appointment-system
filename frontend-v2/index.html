<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>МедРегистратура — Вход в систему</title>
    <link href="https://jsdelivr.net" rel="stylesheet">
    <style>
        body { background-color: #0c2340; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; font-family: system-ui, sans-serif; }
        .login-card { background: white; padding: 40px; border-radius: 24px; box-shadow: 0 20px 50px rgba(0,0,0,0.3); width: 100%; max-width: 440px; }
        .form-label { font-size: 12px; font-weight: 700; color: #475569; text-transform: uppercase; margin-bottom: 6px; display: block; text-align: left; }
        .input-custom { border-radius: 12px; padding: 12px; font-weight: 600; background-color: #f8fafc; border: 1px solid #e2e8f0; font-size: 14px; }
        .btn-blue { background-color: #0d6efd; color: white; font-weight: 700; border-radius: 12px; padding: 14px; width: 100%; border: none; font-size: 14px; }
        .btn-blue:hover { background-color: #0b5ed7; }
    </style>
</head>
<body>
    <div class="login-card text-center">
        <div class="mb-4">
            <h5 class="m-0 fw-bold text-dark">МедРегистратура</h5>
            <small class="text-muted">МИС Поликлиника № 4</small>
        </div>
        <h4 class="fw-bold text-dark mb-1">Вход в систему</h4>
        <p class="text-muted small mb-4">Введите номер полиса ОМС для авторизации</p>
        <form id="loginForm">
            <div class="mb-3">
                <label class="form-label">Номер полиса ОМС</label>
                <input type="text" id="omsInput" maxlength="16" value="7824903155670012" class="form-control input-custom text-center">
            </div>
            <div class="mb-4">
                <label class="form-label">Пароль</label>
                <input type="password" value="password123" class="form-control input-custom text-center bg-light" disabled style="cursor: not-allowed;">
            </div>
            <div id="errorMsg" class="alert alert-danger d-none border-0 small py-2 mb-3">Неверный номер ОМС</div>
            <button type="submit" class="btn btn-blue">Войти</button>
        </form>
    </div>
    <script>
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const oms = document.getElementById('omsInput').value.replace(/\s+/g, '');
            const errorMsg = document.getElementById('errorMsg');
            if (oms.length !== 16 || !/^\d+$/.test(oms)) { errorMsg.classList.remove('d-none'); return; }
            try {
                const response = await fetch('https://onrender.com', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ oms_policy: oms })
                });
                const data = await response.json();
                if (response.ok && data.status === 'success') {
                    localStorage.setItem('patient_fio', data.user.fio);
                    window.location.href = 'dashboard.html';
                } else { errorMsg.classList.remove('d-none'); }
            } catch (err) { errorMsg.classList.remove('d-none'); }
        });
    </script>
</body>
</html>
