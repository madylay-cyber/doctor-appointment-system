<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>МедРегистратура — Список приемов</title>
    <link href="https://jsdelivr.net" rel="stylesheet">
    <style>
        body { background-color: #f4f7fc; font-family: sans-serif; }
        .table-card { background: white; border-radius: 1rem; box-shadow: 0 0.5rem 1.5rem rgba(0,0,0,0.02); border: 1px solid #eef2f5; overflow: hidden; }
    </style>
</head>
<body>
    <header class="bg-white border-b border-light px-4 py-3 d-flex align-items-center justify-content-between shadow-sm">
        <div class="d-flex align-items-center">
            <div class="bg-primary text-white rounded p-2 me-2 fw-bold small">M</div>
            <div>
                <h6 class="m-0 fw-bold text-dark">МедРегистратура</h6>
                <small class="text-muted text-uppercase" style="font-size: 8px; font-weight: 700;">МИС · Поликлиника № 4</small>
            </div>
        </div>
        <div class="d-flex align-items-center">
            <div class="bg-light rounded-circle p-2 me-2 fw-bold small text-secondary">AC</div>
            <div class="text-start">
                <div class="small font-weight-bold text-dark" id="patientName">Загрузка...</div>
                <small class="text-muted text-uppercase block" style="font-size: 8px; font-weight: 700;">Пациент</small>
            </div>
        </div>
    </header>

    <main class="container py-5" style="max-width: 1140px;">
        <div class="d-flex justify-between align-items-center mb-4">
            <div>
                <h3 class="fw-bold text-dark m-0">Список заявок и приемов</h3>
                <p class="text-muted small m-0 mt-1">Всего сегодня: 48 приемов</p>
            </div>
        </div>

        <div class="table-card bg-white">
            <div class="table-responsive">
                <table class="table table-hover align-middle m-0 text-start" style="font-size: 13px;">
                    <thead class="table-light text-muted uppercase fw-bold" style="font-size: 11px;">
                        <tr>
                            <th class="p-3 ps-4">ID Слота</th>
                            <th class="p-3">Пациент</th>
                            <th class="p-3">Врач (Специализация)</th>
                            <th class="p-3">Дата и время</th>
                        </tr>
                    </thead>
                    <tbody id="appointmentsTable" class="text-secondary fw-medium">
                        <!-- Сюда загрузятся данные -->
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <script>
        const name = localStorage.getItem('patient_fio') || 'Иванова Мария Сергеевна';
        document.getElementById('patientName').textContent = name;

        async function loadAppointments() {
            try {
                // ПОЛНЫЙ ПРАВИЛЬНЫЙ АДРЕС СЕРВЕРА
                const response = await fetch('https://onrender.com');
                const appointments = await response.json();
                const table = document.getElementById('appointmentsTable');
                table.innerHTML = '';

                appointments.forEach((appt) => {
                    table.innerHTML += `
                        <tr>
                            <td class="p-3 ps-4 fw-bold text-primary">SLT-10${appt.id}</td>
                            <td class="p-3">
                                <div class="fw-bold text-dark">${name}</div>
                                <small class="text-muted" style="font-size: 10px;">ОМС 7824 9031 5567 0012</small>
                            </td>
                            <td class="p-3">
                                <div class="fw-bold text-dark">${appt.doctor_fio}</div>
                                <small class="text-muted" style="font-size: 10px;">Кардиологическое отделение</small>
                            </td>
                            <td class="p-3 fw-bold text-dark">${appt.datetime_slot}</td>
                        </tr>`;
                });
            } catch (err) {
                document.getElementById('appointmentsTable').innerHTML = `<tr><td colspan="4" class="p-4 text-center text-danger">Ошибка связи с сервером Render.</td></tr>`;
            }
        }
        loadAppointments();
    </script>
</body>
</html>
