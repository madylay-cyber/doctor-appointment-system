<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>МедРегистратура — Запись на прием</title>
    <script src="https://tailwindcss.com"></script>
    <link href="https://googleapis.com" rel="stylesheet">
    <style>body { font-family: 'Inter', sans-serif; }</style>
</head>
<body class="bg-[#f4f7fc] min-h-screen">
    <header class="bg-white border-b border-slate-100 px-8 py-4 flex items-center justify-between shadow-sm">
        <div class="flex items-center space-x-3">
            <div class="h-9 w-9 bg-blue-600 text-white rounded-lg flex items-center justify-center font-bold text-sm">M</div>
            <div>
                <h1 class="text-sm font-bold text-slate-800 leading-tight">МедРегистратура</h1>
                <p class="text-[10px] text-slate-400 font-semibold">МИС · Поликлиника № 4</p>
            </div>
        </div>
        <a href="dashboard.html" class="text-xs font-bold text-slate-400 hover:text-slate-600">← Вернуться назад</a>
    </header>
    <main class="max-w-5xl mx-auto p-8 grid grid-cols-1 lg:grid-cols-3 gap-8">
        <div class="lg:col-span-2 space-y-6">
            <div class="bg-white rounded-2xl p-6 border border-slate-100 shadow-sm space-y-5">
                <h2 class="text-lg font-bold text-slate-800">Запись на прием к врачу</h2>
                <div>
                    <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-2">Пациент (ФИО / ОМС)</label>
                    <select class="w-full bg-slate-50 rounded-xl border border-slate-200 px-4 py-3 text-xs font-bold text-slate-700 outline-none">
                        <option>Иванова Мария Сергеевна · 7824 9031 5567 0012</option>
                    </select>
                </div>
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-2">Категория услуг</label>
                        <select id="categorySelect" class="w-full rounded-xl border border-slate-200 px-4 py-3 text-xs font-semibold text-slate-700 focus:border-blue-500 outline-none">
                            <option value="1">Кардиология · I10-I15</option>
                            <option value="2">Терапия · J00-J99</option>
                        </select>
                    </div>
                </div>
            </div>
        </div>
        <div class="bg-white rounded-2xl p-6 border border-slate-100 shadow-sm flex flex-col justify-between">
            <div class="space-y-4">
                <h3 class="text-xs font-bold text-slate-500 uppercase tracking-wider">Дата и время приёма</h3>
                <div class="bg-blue-50 border border-blue-100 rounded-xl p-3 text-[11px] font-medium text-blue-600 text-center">
                    Выбран слот: 2026-11-20 14:00 - длительность 30 мин
                </div>
            </div>
            <p id="bookingError" class="hidden text-xs font-semibold text-rose-500 text-center mt-4"></p>
            <button id="submitBooking" class="w-full bg-blue-600 hover:bg-blue-700 text-white text-xs font-bold py-4 rounded-xl shadow-lg transition-all">
                Забронировать слот
            </button>
        </div>
    </main>
    <script>
        document.getElementById('submitBooking').addEventListener('click', async () => {
            const errorMsg = document.getElementById('bookingError');
            const payload = {
                patient_id: 5,
                doctor_id: 1,
                category_id: parseInt(document.getElementById('categorySelect').value),
                datetime_slot: "2026-11-20 14:00"
            };
            try {
                const response = await fetch('https://onrender.com', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                if (response.ok) {
                    alert('Запись успешно оформлена!');
                    window.location.href = 'dashboard.html';
                } else {
                    errorMsg.textContent = 'Этот слот уже занят другим пациентом (Race Condition)!';
                    errorMsg.classList.remove('hidden');
                }
            } catch (err) {
                errorMsg.textContent = 'Ошибка отправки запроса.';
                errorMsg.classList.remove('hidden');
            }
        });
    </script>
</body>
</html>
