<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>МедРегистратура — Список приемов</title>
    <link rel="stylesheet" href="https://cloudflare.com">
    <link href="https://googleapis.com" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .bg-custom-layout { background-color: #f4f7fc; }
    </style>
</head>
<body class="bg-custom-layout min-h-screen">
    <header class="bg-white border-b border-gray-100 px-8 py-4 flex items-center justify-between shadow-sm">
        <div class="flex items-center space-x-3">
            <div class="h-9 w-9 bg-blue-600 text-white rounded-lg flex items-center justify-center font-bold text-sm">M</div>
            <div>
                <h1 class="text-sm font-bold text-gray-800 leading-tight">МедРегистратура</h1>
                <p class="text-[10px] text-gray-400 font-semibold">МИС · Поликлиника № 4</p>
            </div>
        </div>
        <div class="flex items-center space-x-2">
            <div class="h-8 w-8 rounded-full bg-gray-100 flex items-center justify-center text-xs font-bold text-gray-600">AC</div>
            <div class="text-left">
                <div class="text-xs font-bold text-gray-800" id="patientName">Загрузка...</div>
                <div class="text-[9px] text-gray-400 font-semibold uppercase">Администратор</div>
            </div>
        </div>
    </header>
    <main class="max-w-6xl mx-auto p-8">
        <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between mb-8">
            <div>
                <h2 class="text-2xl font-bold text-gray-800">Список заявок и приемов</h2>
                <p class="text-xs text-gray-400 font-medium mt-1">Всего сегодня: 48 приемов</p>
            </div>
            <button onclick="window.location.href='book.html'" class="bg-blue-600 hover:bg-blue-700 text-white text-xs font-bold px-5 py-3 rounded-xl shadow-md transition-all">
                + Создать заявку
            </button>
        </div>
        <div class="bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden">
            <table class="w-full text-left border-collapse">
                <thead>
                    <tr class="bg-gray-50 text-gray-400 font-semibold text-[11px] uppercase tracking-wider border-b border-gray-100">
                        <th class="p-4">ID Слота</th>
                        <th class="p-4">Пациент</th>
                        <th class="p-4">Врач</th>
                        <th class="p-4">Дата и время</th>
                        <th class="p-4 text-center">Управление</th>
                    </tr>
                </thead>
                <tbody id="appointmentsTable" class="divide-y divide-gray-100 text-xs text-gray-600 font-medium">
                    <!-- Записи -->
                </tbody>
            </table>
        </div>
    </main>
    <script>
        const name = localStorage.getItem('patient_fio') || 'Иванова Мария Сергеевна';
        document.getElementById('patientName').textContent = name;
        async function loadAppointments() {
            try {
                const response = await fetch('https://onrender.com');
                const appointments = await response.json();
                const table = document.getElementById('appointmentsTable');
                table.innerHTML = '';
                appointments.forEach((appt) => {
                    table.innerHTML += `
                        <tr class="hover:bg-gray-50 transition-colors">
                            <td class="p-4 font-bold text-blue-600">SLT-10${appt.id}</td>
                            <td class="p-4">
                                <div class="font-bold text-gray-800">${name}</div>
                                <div class="text-[10px] text-gray-400">ОМС 7824 9031 5567 0012</div>
                            </td>
                            <td class="p-4">
                                <div class="font-bold text-gray-800">${appt.doctor_fio}</div>
                            </td>
                            <td class="p-4 font-semibold text-gray-700">${appt.datetime_slot}</td>
                            <td class="p-4 text-center">
                                <button onclick="window.location.href='delete.html?id=${appt.id}'" class="text-[11px] font-bold text-rose-500 bg-rose-50 hover:bg-rose-100 px-3 py-1.5 rounded-lg transition-all">Удалить</button>
                            </td>
                        </tr>`;
                });
            } catch (err) {
                document.getElementById('appointmentsTable').innerHTML = `<tr><td colspan="5" class="p-8 text-center text-red-500">Ошибка связи с сервером.</td></tr>`;
            }
        }
        loadAppointments();
    </script>
</body>
</html>
