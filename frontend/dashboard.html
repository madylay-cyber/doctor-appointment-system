<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>МедРегистратура — Список заявок и приемов</title>
    <script src="https://tailwindcss.com"></script>
    <link href="https://googleapis.com" rel="stylesheet">
    <style>body { font-family: 'Inter', sans-serif; }</style>
</head>
<body class="bg-[#f4f7fc] min-h-screen">

    <!-- Верхний Навбар -->
    <header class="bg-white border-b border-slate-100 px-12 py-4 flex items-center justify-between shadow-sm">
        <div class="flex items-center space-x-12">
            <div class="flex items-center space-x-3">
                <div class="h-10 w-10 bg-blue-600 text-white rounded-xl flex items-center justify-center font-bold text-base shadow-md shadow-blue-600/10">M</div>
                <div>
                    <h1 class="text-sm font-bold text-slate-800 leading-tight tracking-wide">МедРегистратура</h1>
                    <p class="text-[10px] text-slate-400 font-bold uppercase tracking-wider">МИС · Поликлиника № 4</p>
                </div>
            </div>
            <nav class="hidden md:flex space-x-8 text-xs font-bold text-slate-400 tracking-wide">
                <a href="#" class="text-blue-600 border-b-2 border-blue-600 pb-5 -mb-5">Приемы</a>
                <a href="#" class="hover:text-slate-600 transition-colors">Расписание</a>
                <a href="#" class="hover:text-slate-600 transition-colors">Пациенты</a>
                <a href="#" class="hover:text-slate-600 transition-colors">Врачи</a>
                <a href="#" class="hover:text-slate-600 transition-colors">Отчеты</a>
            </nav>
        </div>
        <div class="flex items-center space-x-4">
            <div class="flex items-center space-x-3 border-l border-slate-100 pl-4">
                <div class="h-9 w-9 rounded-full bg-blue-50 text-blue-600 flex items-center justify-center text-xs font-bold border border-blue-100">ИМ</div>
                <div class="text-left hidden sm:block">
                    <div class="text-xs font-bold text-slate-800" id="patientName">Загрузка...</div>
                    <div class="text-[9px] text-slate-400 font-bold uppercase tracking-wider">Пациент</div>
                </div>
            </div>
        </div>
    </header>

    <main class="max-w-6xl mx-auto p-12">
        <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between mb-8">
            <div>
                <h2 class="text-2xl font-bold text-slate-800 tracking-tight">Список заявок и приемов</h2>
                <p class="text-xs text-slate-400 font-semibold tracking-wide mt-1">Всего сегодня: 48 приемов · свободно слотов: 12 · ожидают подтверждения: 6</p>
            </div>
            <button onclick="window.location.href='book.html'" class="mt-4 sm:mt-0 bg-blue-600 hover:bg-blue-700 text-white text-xs font-bold px-6 py-3.5 rounded-xl shadow-lg shadow-blue-600/10 flex items-center space-x-2 active:scale-95 transition-all">
                <span>+ Создать заявку</span>
            </button>
        </div>

        <div class="bg-white rounded-3xl shadow-xl shadow-slate-200/40 border border-slate-100/80 overflow-hidden">
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="bg-slate-50/70 text-slate-400 font-bold text-[11px] uppercase tracking-wider border-b border-slate-100/60">
                            <th class="p-5 pl-6">ID Слота</th>
                            <th class="p-5">Пациент</th>
                            <th class="p-5">Врач (Специализация)</th>
                            <th class="p-5">Дата и время</th>
                            <th class="p-5">Статус</th>
                            <th class="p-5 pr-6 text-center">Управление</th>
                        </tr>
                    </thead>
                    <tbody id="appointmentsTable" class="divide-y divide-slate-100 text-xs text-slate-600 font-medium">
                        <!-- Сюда JS загрузит записи -->
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <script>
        const name = localStorage.getItem('patient_fio') || 'Иванова Мария Сергеевна';
        document.getElementById('patientName').textContent = name;

        async function loadAppointments() {
            try {
                const response = await fetch('https://onrender.com');
                const appointments = await response.json();
                const table = document.getElementById('appointmentsTable');
                table.innerHTML = '';

                appointments.forEach((appt) => {
                    table.innerHTML += `
                        <tr class="hover:bg-slate-50/40 transition-colors">
                            <td class="p-5 pl-6 font-bold text-blue-600 tracking-wide">SLT-10${appt.id}</td>
                            <td class="p-5">
                                <div class="font-bold text-slate-800 text-sm">${name}</div>
                                <div class="text-[10px] text-slate-400 font-medium mt-0.5">ОМС 7824 9031 5567 0012</div>
                            </td>
                            <td class="p-5">
                                <div class="font-bold text-slate-800 text-sm">${appt.doctor_fio}</div>
                                <div class="text-[10px] text-slate-400 font-medium mt-0.5">Кардиологическое отделение</div>
                            </td>
                            <td class="p-5 font-bold text-slate-700 text-sm">${appt.datetime_slot}</td>
                            <td class="p-5">
                                <span class="inline-flex items-center rounded-full bg-blue-50 px-3 py-1 text-[10px] font-bold text-blue-600 border border-blue-100">
                                    Подтверждено
                                </span>
                            </td>
                            <td class="p-5 pr-6 text-center">
                                <button onclick="window.location.href='delete.html?id=${appt.id}'" class="text-[11px] font-bold text-rose-500 bg-rose-50 hover:bg-rose-100/70 border border-rose-100 px-3.5 py-2 rounded-xl transition-all">Удалить</button>
                            </td>
                        </tr>`;
                });
            } catch (err) {
                document.getElementById('appointmentsTable').innerHTML = `<tr><td colspan="6" class="p-8 text-center text-rose-500">Ошибка связи с сервером Render.</td></tr>`;
            }
        }
        loadAppointments();
    </script>
</body>
</html>
