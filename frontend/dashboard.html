<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>МедРегистратура — Список заявок и приемов</title>
    <script src="https://tailwindcss.com"></script>
    <link href="https://googleapis.com" rel="stylesheet">
    <style>body { font-family: 'Inter', sans-serif; }</style>
</head>
<body class="bg-[#f4f7fc] min-h-screen">

    <header class="bg-white border-b border-slate-100 px-8 py-4 flex items-center justify-between shadow-sm">
        <div class="flex items-center space-x-8">
            <div class="flex items-center space-x-3">
                <div class="h-9 w-9 bg-blue-600 text-white rounded-lg flex items-center justify-center font-bold text-sm">M</div>
                <div>
                    <h1 class="text-sm font-bold text-slate-800 leading-tight">МедРегистратура</h1>
                    <p class="text-[10px] text-slate-400 font-semibold">МИС · Поликлиника № 4</p>
                </div>
            </div>
            <nav class="hidden md:flex space-x-6 text-xs font-bold text-slate-400">
                <a href="#" class="text-blue-600 border-b-2 border-blue-600 pb-5 -mb-5">Приемы</a>
                <a href="#" class="hover:text-slate-600">Расписание</a>
                <a href="#" class="hover:text-slate-600">Пациенты</a>
                <a href="#" class="hover:text-slate-600">Врачи</a>
                <a href="#" class="hover:text-slate-600">Отчеты</a>
            </nav>
        </div>
        <div class="flex items-center space-x-4">
            <div class="flex items-center space-x-2">
                <div class="h-8 w-8 rounded-full bg-slate-100 flex items-center justify-center text-xs font-bold text-slate-600" id="userInitial">AC</div>
                <div class="text-left hidden sm:block">
                    <div class="text-xs font-bold text-slate-800" id="patientName">Загрузка...</div>
                    <div class="text-[9px] text-slate-400 font-semibold uppercase">Администратор</div>
                </div>
            </div>
        </div>
    </header>

    <main class="max-w-6xl mx-auto p-8">
        <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between mb-8">
            <div>
                <h2 class="text-2xl font-bold text-slate-800">Список заявок и приемов</h2>
                <p class="text-xs text-slate-400 font-medium mt-1">Всего сегодня: 48 приемов · свободно слотов: 12 · ожидают подтверждения: 6</p>
            </div>
            <button onclick="window.location.href='book.html'" class="mt-4 sm:mt-0 bg-blue-600 hover:bg-blue-700 text-white text-xs font-bold px-5 py-3 rounded-xl shadow-md shadow-blue-600/10 flex items-center space-x-2 transition-all">
                <span>+ Создать заявку</span>
            </button>
        </div>

        <div class="bg-white rounded-2xl shadow-sm border border-slate-100 overflow-hidden">
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="bg-slate-50/70 text-slate-400 font-semibold text-[11px] uppercase tracking-wider border-b border-slate-100">
                            <th class="p-4">ID Слота</th>
                            <th class="p-4">Пациент</th>
                            <th class="p-4">Врач (Специализация)</th>
                            <th class="p-4">Дата и время</th>
                            <th class="p-4">Статус</th>
                            <th class="p-4 text-center">Управление</th>
                        </tr>
                    </thead>
                    <tbody id="appointmentsTable" class="divide-y divide-slate-100 text-xs text-slate-600 font-medium">
                        <!-- Данные -->
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <script>
        const name = localStorage.getItem('patient_fio') || 'Смирнова А. В.';
        document.getElementById('patientName').textContent = name;

        async function loadAppointments() {
            try {
                const response = await fetch('https://onrender.com');
                const appointments = await response.json();
                const table = document.getElementById('appointmentsTable');
                table.innerHTML = '';

                appointments.forEach((appt, i) => {
                    table.innerHTML += `
                        <tr class="hover:bg-slate-50/50 transition-colors">
                            <td class="p-4 font-bold text-blue-600">SLT-10${appt.id}</td>
                            <td class="p-4">
                                <div class="font-bold text-slate-800">${name}</div>
                                <div class="text-[10px] text-slate-400 font-normal">ОМС 7824 9031 5567 0012</div>
                            </td>
                            <td class="p-4">
                                <div class="font-bold text-slate-800">${appt.doctor_fio}</div>
                                <div class="text-[10px] text-slate-400 font-normal">Терапевтическое отделение</div>
                            </td>
                            <td class="p-4 font-semibold text-slate-700">${appt.datetime_slot}</td>
                            <td class="p-4"><span class="inline-flex items-center rounded-md bg-blue-50 px-2 py-1 text-[10px] font-bold text-blue-600 border border-blue-100">Подтверждено</span></td>
                            <td class="p-4 text-center">
                                <button onclick="window.location.href='delete.html?id=${appt.id}'" class="text-[11px] font-bold text-rose-500 bg-rose-50 hover:bg-rose-100 px-3 py-1.5 rounded-lg transition-all">Удалить</button>
                            </td>
                        </tr>`;
                });
            } catch (err) {
                document.getElementById('appointmentsTable').innerHTML = `<tr><td colspan="6" class="p-8 text-center text-rose-500">Ошибка связи с Render.</td></tr>`;
            }
        }
        loadAppointments();
    </script>
</body>
</html>
