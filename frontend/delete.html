<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>МедРегистратура — Удаление записи</title>
    <script src="https://tailwindcss.com"></script>
    <link href="https://googleapis.com" rel="stylesheet">
    <style>body { font-family: 'Inter', sans-serif; }</style>
</head>
<body class="bg-slate-900/40 min-h-screen flex items-center justify-center p-4">
    <div class="w-full max-w-md bg-white rounded-3xl p-8 border border-slate-100 shadow-2xl text-center space-y-6">
        <div class="space-y-2">
            <h2 class="text-xl font-bold text-slate-800">Удалить запись?</h2>
            <p class="text-xs text-slate-400 leading-relaxed font-medium">Вы уверены, что хотите безвозвратно удалить медицинскую запись? Данное действие нельзя будет отменить.</p>
        </div>
        <div class="bg-slate-50 border border-slate-100 rounded-xl p-4 flex items-center space-x-3 text-left">
            <div class="text-xs font-bold text-slate-700" id="slotInfo">Загрузка информации...</div>
        </div>
        <div class="grid grid-cols-2 gap-3 pt-2">
            <button onclick="window.location.href='dashboard.html'" class="w-full bg-slate-50 text-slate-500 text-xs font-bold py-3.5 rounded-xl border border-slate-200">
                Нет, сохранить
            </button>
            <button id="confirmDeleteBtn" class="w-full bg-rose-600 text-white text-xs font-bold py-3.5 rounded-xl shadow-lg">
                Да, удалить
            </button>
        </div>
    </div>
    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const apptId = urlParams.get('id');
        document.getElementById('slotInfo').textContent = `Слот: SLT-10${apptId} · Пациент: Иванова М. С.`;
        document.getElementById('confirmDeleteBtn').addEventListener('click', async () => {
            try {
                const response = await fetch(`https://onrender.com{apptId}`, {
                    method: 'DELETE'
                });
                if (response.ok) {
                    alert('Запись удалена!');
                    window.location.href = 'dashboard.html';
                }
            } catch (err) {
                alert('Ошибка отправки запроса на Render.');
            }
        });
    </script>
</body>
</html>
