<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>МедРегистратура — Удаление записи</title>
    <script src="https://tailwindcss.com"></script>
    <link href="https://googleapis.com" rel="stylesheet">
    <style>body { font-family: 'Inter', sans-serif; }</style>
</head>
<body class="bg-slate-900/40 min-h-screen flex items-center justify-center p-4 relative">

    <div class="w-full max-w-md bg-white rounded-3xl p-8 border border-slate-100 shadow-2xl text-center space-y-6 z-10">
        
        <div class="space-y-2">
            <h2 class="text-xl font-bold text-slate-800">Удалить запись?</h2>
            <p class="text-xs text-slate-400 leading-relaxed font-medium">Вы уверены, что хотите безвозвратно удалить медицинскую запись? Данное действие нельзя будет отменить.</p>
        </div>

        <div class="bg-slate-50 border border-slate-100 rounded-xl p-4 flex items-center space-x-3 text-left">
            <div>
                <div class="text-xs font-bold text-slate-700" id="slotInfo">SLT-1042 · Иванова М. С.</div>
                <div class="text-[10px] text-slate-400 font-medium mt-0.5">06 ноя · 09:30 · Петрова Е. А.</div>
            </div>
        </div>

        <div class="grid grid-cols-2 gap-3 pt-2">
            <button onclick="window.location.href='dashboard.html'" class="w-full bg-slate-50 hover:bg-slate-100 text-slate-500 text-xs font-bold py-3.5 rounded-xl border border-slate-200 transition-all">
                Нет, сохранить
            </button>
            <button id="confirmDeleteBtn" class="w-full bg-rose-600 hover:bg-rose-700 text-white text-xs font-bold py-3.5 rounded-xl shadow-lg shadow-rose-600/10 transition-all">
                Да, удалить
            </button>
        </div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const apptId = urlParams.get('id');
        
        document.getElementById('slotInfo').textContent = `SLT-10${apptId} · Иванова М. С.`;

        document.getElementById('confirmDeleteBtn').addEventListener('click', async () => {
            try {
                const response = await fetch(`https://onrender.com{apptId}`, {
                    method: 'DELETE'
                });
                if (response.ok) {
                    alert('Медицинская запись каскадно и навсегда удалена из СУБД клиники!');
                    window.location.href = 'dashboard.html';
                }
            } catch (err) {
                alert('Ошибка отправки запроса на Render.');
            }
        });
    </script>
</body>
</html>
